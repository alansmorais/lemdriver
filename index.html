<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM Motoristas • Litoral em Movimento (Web App iOS/Android)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate900: '#0F172A',
                        slate800: '#1E293B',
                        slate700: '#334155',
                        slate500: '#64748B',
                        slate100: '#F1F5F9',
                        slateBg: '#F8F9FF',
                        amberVibrant: '#F59E0B',
                        amberDeep: '#B45309',
                        emeraldVibrant: '#059669',
                        emeraldDark: '#047857',
                        emeraldLightBg: '#ECFDF5',
                        brandBlue: '#2563EB',
                        destRed: '#B91C1C'
                    }
                }
            }
        }
    </script>
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="manifest" href="web/manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LEM Motoristas">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="h-full bg-slateBg text-slate900 flex flex-col antialiased">

    <!-- Toast Notification Banner -->
    <div id="toast-container" class="fixed top-4 left-4 right-4 z-50 flex flex-col items-center pointer-events-none transition-all duration-300 transform -translate-y-20 opacity-0">
        <div id="toast-box" class="bg-slate900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 max-w-md w-full border border-slate700">
            <span id="toast-icon" class="material-symbols-outlined text-amberVibrant text-xl">check_circle</span>
            <span id="toast-msg" class="text-sm font-semibold flex-1">Mensagem do Sistema</span>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app" class="flex-1 flex flex-col max-w-lg mx-auto w-full bg-white shadow-xl relative overflow-hidden">
        
        <!-- Top App Header (Visible when logged in) -->
        <header id="app-header" class="hidden bg-slate950 text-white px-4 py-3 flex items-center justify-between border-b border-slate800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-amberVibrant flex items-center justify-center text-slate900 font-extrabold text-sm" id="header-driver-initials">
                    ES
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide text-white" id="header-driver-name">Eduardo Silveira</h1>
                    <p class="text-xs text-amber-400 font-medium" id="header-vehicle-badge">Spin Premier • SP-LIT7A24</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleAudioAndPushPermissions()" id="sound-badge" class="bg-emerald-900/60 text-emerald-300 border border-emerald-700 px-2.5 py-1 rounded-full text-xs font-bold flex items-center space-x-1">
                    <span class="material-symbols-outlined text-sm">volume_up</span>
                    <span id="sound-status-text">Som Ativo</span>
                </button>
                <button onclick="openProfile()" class="w-9 h-9 rounded-full bg-slate800 flex items-center justify-center text-slate300 hover:bg-slate700">
                    <span class="material-symbols-outlined text-lg">person</span>
                </button>
            </div>
        </header>

        <!-- Dynamic Screen Content Area -->
        <main class="flex-1 overflow-y-auto pb-24" id="main-content">
            <!-- Content dynamically rendered via app.js -->
        </main>

        <!-- Bottom Navigation Bar (Visible when logged in) -->
        <nav id="bottom-nav" class="hidden absolute bottom-0 left-0 right-0 bg-slate950 border-t border-slate800 px-3 py-2 flex items-center justify-around z-30">
            <button onclick="switchTab('viagens')" id="nav-viagens" class="flex flex-col items-center text-amberVibrant transition-all">
                <span class="material-symbols-outlined text-2xl">directions_car</span>
                <span class="text-[10px] font-bold mt-0.5">Escalas</span>
            </button>
            <button onclick="switchTab('rota')" id="nav-rota" class="flex flex-col items-center text-slate-400 hover:text-white transition-all">
                <span class="material-symbols-outlined text-2xl">navigation</span>
                <span class="text-[10px] font-semibold mt-0.5">Em Rota</span>
            </button>
            <button onclick="switchTab('ganhos')" id="nav-ganhos" class="flex flex-col items-center text-slate-400 hover:text-white transition-all">
                <span class="material-symbols-outlined text-2xl">payments</span>
                <span class="text-[10px] font-semibold mt-0.5">Ganhos</span>
            </button>
            <button onclick="switchTab('perfil')" id="nav-perfil" class="flex flex-col items-center text-slate-400 hover:text-white transition-all">
                <span class="material-symbols-outlined text-2xl">badge</span>
                <span class="text-[10px] font-semibold mt-0.5">Perfil</span>
            </button>
        </nav>
    </div>

    <!-- New Trip Assignment Pop-up Modal -->
    <div id="assignment-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-3">
        <div class="bg-white rounded-3xl max-w-md w-full p-4 md:p-6 max-h-[88vh] overflow-y-auto shadow-2xl border border-slate200 flex flex-col items-center text-center">
            <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 mb-2 shadow-inner">
                <span class="material-symbols-outlined text-2xl animate-pulse">notifications_active</span>
            </div>
            <h3 class="text-lg font-extrabold text-slate900">🚨 NOVA CORRIDA ATRIBUÍDA!</h3>
            <p class="text-[11px] text-slate-500 mt-0.5">A Central de Despacho LEM vinculou uma nova reserva à sua escala.</p>
            
            <div id="modal-trip-details" class="w-full bg-slate-100 rounded-2xl p-3 mt-3 text-left space-y-1.5 border border-slate-200 text-xs">
                <!-- Injected via JS -->
            </div>

            <div class="flex flex-col w-full gap-2 mt-4">
                <button onclick="acceptAndStartAssignedTrip()" class="w-full bg-amberVibrant hover:bg-amber-500 text-slate950 font-extrabold py-3 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-xs">
                    <span class="material-symbols-outlined text-sm">navigation</span>
                    <span>ACEITAR & INICIAR ROTA</span>
                </button>
                <div class="flex gap-2">
                    <button onclick="viewAssignedTripInList()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate800 font-bold py-2 rounded-xl text-[11px]">
                        Ver na Lista
                    </button>
                    <button onclick="closeAssignmentModal()" class="flex-1 bg-slate-900 hover:bg-slate800 text-white font-bold py-2 rounded-xl text-[11px]">
                        Entendido (OK)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script src="web/app.js"></script>
</body>
</html>
